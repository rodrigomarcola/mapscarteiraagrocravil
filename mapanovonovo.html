<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Visualização KML</title>

    <!-- Chamadas dos arquivos locais modulares que você criou -->
    <link rel="stylesheet" href="estilos.css" />
    <script src="dados.js"></script>

    <script>
        function carregarScript(url) {
            var s = document.createElement('script');
            s.src = url;
            document.head.appendChild(s);
        }
        function carregarCSS(url) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = url;
            document.head.appendChild(l);
        }

        // URLs fatiadas para proteção contra cortes de strings
        carregarCSS("https://" + "://unpkg.com" + "leaflet@1.9.4/" + "dist/leaflet.css");
        carregarCSS("https://" + "://unpkg.com" + "@geoman-io/leaflet-geoman-free@2.17.0/" + "dist/leaflet-geoman.css");
        
        carregarScript("https://" + "://unpkg.com" + "leaflet@1.9.4/" + "dist/leaflet.js");
        
        setTimeout(function() {
            carregarScript("https://" + "://unpkg.com" + "@geoman-io/leaflet-geoman-free@2.17.0/" + "dist/leaflet-geoman.min.js");
        }, 150);
    </script>
</head>
<body>
    <button id="toggle-btn">☰ Ocultar Lista</button>
    
    <div id="container">
        <div id="sidebar">
            <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #ddd;">
                <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; font-size: 14px;">🗺️ Estilo do Mapa de Fundo:</label>
                <select id="seletor-fundo-agro" onchange="mudarFundoDoMapa(this.value)" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; background: white;">
                    <option value="satelite-esri">🛰️ Satélite (Esri)</option>
                    <option value="satelite-google" selected>🛰️ Satélite (Google Híbrido)</option>
                    <option value="relevo-google">⛰️ Relevo (Google Terrain)</option>
                    <option value="topo-curvas">📐 Topográfico (Curvas de Nível)</option>
                    <option value="mapa-osm">🗺️ Mapa Normal (OSM)</option>
                    <option value="mapa-limpo">🏁 Mapa Técnico Limpo</option>
                </select>
            </div>

            <h3 style="margin-top: 10px; margin-bottom: 15px;">Elementos</h3>
            <div class="list-item" data-type="polygon">
                <input type="checkbox" class="layer-toggle" data-type="polygon" checked>
                <div class="item-text" style="display: flex; align-items: center; gap: 8px;">
                    <div style="position: relative; width: 14px; height: 14px; background: rgba(255, 82, 82, 0.35); border: 2px solid #FF5252; box-sizing: border-box; flex-shrink: 0;">
                        <div style="position: absolute; width: 4px; height: 4px; background: white; border: 1px solid #FF5252; border-radius: 50%; top: -4px; left: -4px;"></div>
                        <div style="position: absolute; width: 4px; height: 4px; background: white; border: 1px solid #FF5252; border-radius: 50%; top: -4px; right: -4px;"></div>
                        <div style="position: absolute; width: 4px; height: 4px; background: white; border: 1px solid #FF5252; border-radius: 50%; bottom: -4px; left: -4px;"></div>
                        <div style="position: absolute; width: 4px; height: 4px; background: white; border: 1px solid #FF5252; border-radius: 50%; bottom: -4px; right: -4px;"></div>
                    </div>
                    <div>
                        Área Principal<br>
                        <small>60 - 2026 - RODRIGO MARCOLA</small><br>
                        <small style="color: #2196F3; font-weight: bold;" id="area-label">Calculando área...</small>
                    </div>
                </div>
            </div>

            <div class="list-item" data-type="marker" data-id="ponto1">
                <input type="checkbox" class="layer-toggle" data-type="marker" data-id="ponto1" checked>
                <div class="item-text">📍 Ponto Principal<br><small>111644 - RODRIGO MARCOLA</small></div>
            </div>
            <div class="list-item" data-type="marker" data-id="ponto2">
                <input type="checkbox" class="layer-toggle" data-type="marker" data-id="ponto2" checked>
                <div class="item-text">📍 Segundo Ponto<br><small>Acompanhamento Técnico</small></div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        setTimeout(function() {
            if (typeof L === 'undefined') return;

            window.calcularAreaPlanometrica = function(coords) {
                let area = 0; const R = 6378137;
                if (coords.length > 2) {
                    for (let i = 0; i < coords.length - 1; i++) {
                        let p1 = coords[i]; let p2 = coords[i + 1];
                        let lat1 = p1.lat * Math.PI / 180; let lat2 = p2.lat * Math.PI / 180;
                        let lon1 = p1.lng * Math.PI / 180; let lon2 = p2.lng * Math.PI / 180;
                        area += (lon2 - lon1) * (2 + Math.sin(lat1) + Math.sin(lat2));
                    }
                    area = area * R * R / 2;
                }
                return Math.abs(area);
            };

            window.atualizarRotuloDeArea = function(camadaPoligono) {
                const pontosAtuais = camadaPoligono.getLatLngs()[0];
                const pontosFechados = [...pontosAtuais, pontosAtuais[0]];
                const areaMetros = calcularAreaPlanometrica(pontosFechados);
                const areaHectares = areaMetros / 10000;
                const textoArea = areaHectares.toFixed(2) + " ha (" + areaMetros.toLocaleString('pt-BR', {maximumFractionDigits: 0}) + " m²)";
                document.getElementById('area-label').textContent = "Área: " + textoArea;
                camadaPoligono.setPopupContent("<b>Área Principal</b><br>60 - 2026 - RODRIGO MARCOLA<br><b>Medida:</b> " + textoArea);
            };

            const map = L.map('map', { zoomSnap: 0.25, zoomDelta: 0.25, wheelPxPerZoomLevel: 120, zoomAnimation: true }).setView([-27.40, -49.80], 9);

            const satellite = L.tileLayer("https://" + "://arcgisonline.com" + "ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: '&copy; Esri' });
            const osm = L.tileLayer("https://" + "{s}.tile.openstreetmap.org/" + "{z}/{x}/{y}.png", { attribution: '&copy; OSM' });
            const googleHibrido = L.tileLayer("https://" + "://google.com" + "vt/lyrs=y&x={x}&y={y}&z={z}", { attribution: '&copy; Google' }).addTo(map);
            const googleTerreno = L.tileLayer("https://" + "://google.com" + "vt/lyrs=p&x={x}&y={y}&z={z}", { attribution: '&copy; Google' });
            const topoMap = L.tileLayer("https://" + "{s}.tile.opentopomap.org/" + "{z}/{x}/{y}.png", { attribution: '&copy; Topo' });
            const mapaLimpo = L.tileLayer("https://" + "{s}://" + "light_all/{z}/{x}/{y}{r}.png", { attribution: '&copy; CARTO' });

            window.myPolygon = L.polygon(polygonCoords, { color: '#FF5252', weight: 3, fillOpacity: 0.35 }).addTo(map);

            setTimeout(function() {
                if (!map.pm) return;
                myPolygon.pm.enable({ allowSelfIntersection: false });
                atualizarRotuloDeArea(myPolygon);
                myPolygon.on('pm:edit', function() { atualizarRotuloDeArea(myPolygon); });

                window.meusMarcadores = {
                    "ponto1": L.marker([-27.1876285, -49.6066494]).bindPopup("<b>Ponto Principal</b>").addTo(map),
                    "ponto2": L.marker([-27.547539929, -50.025449027]).bindPopup("<b>Segundo Ponto</b>").addTo(map)
                };
                for (let k in meusMarcadores) { meusMarcadores[k].pm.enable(); }

                map.pm.addControls({ position: 'topleft', drawMarker: true, drawPolyline: true, drawPolygon: true, editMode: true, dragMode: true, removalMode: true });
                map.pm.setLang('pt_br');
            }, 250);

            window.todasAsCamadasDeFundo = { "satelite-esri": satellite, "satelite-google": googleHibrido, "relevo-google": googleTerreno, "topo-curvas": topoMap, "mapa-osm": osm, "mapa-limpo": mapaLimpo };
            window.mudarFundoDoMapa = function(c) {
                for (let k in todasAsCamadasDeFundo) { map.removeLayer(todasAsCamadasDeFundo[k]); }
                if (todasAsCamadasDeFundo[c]) { todasAsCamadasDeFundo[c].addTo(map); }
            };

            document.querySelectorAll('.list-item').forEach(item => {
                item.addEventListener('click', function() {
                    const type = this.getAttribute('data-type');
                    const checkbox = this.querySelector('.layer-toggle');
                    if (!checkbox.checked) return;
                    if (type === "polygon") { map.fitBounds(myPolygon.getBounds(), { padding: [60, 60] }); myPolygon.openPopup(); }
                    else if (type === "marker") {
                        const id = this.getAttribute('data-id');
                        if (meusMarcadores[id]) { map.setView(meusMarcadores[id].getLatLng(), 17); meusMarcadores[id].openPopup(); }
                    }
                });
            });

            document.querySelectorAll('.layer-toggle').forEach(chk => {
                chk.addEventListener('change', function(e) {
                    e.stopPropagation();
                    const type = this.getAttribute('data-type');
                    if (type === "polygon") {
                        if (this.checked) { myPolygon.addTo(map); myPolygon.pm.enable(); }
                        else { myPolygon.pm.disable(); map.removeLayer(myPolygon); }
                    } else if (type === "marker") {
                                const id = this.closest('.list-item').getAttribute('data-id');
                                if (meusMarcadores[id]) { 
                                    if (this.checked) { 
                                        meusMarcadores[id].addTo(map); 
                                    } else { 
                                        map.removeLayer(meusMarcadores[id]); 
                                    } 
                                }
                            });

                chk.addEventListener('click', function(e) { 
                    e.stopPropagation(); 
                });
            });

            const sidebar = document.getElementById('sidebar');
            document.getElementById('toggle-btn').addEventListener('click', function() {
                if (sidebar.style.display === 'none') { 
                    sidebar.style.display = 'block'; 
                    this.textContent = '☰ Ocultar Lista'; 
                } else { 
                    sidebar.style.display = 'none'; 
                    this.textContent = '☰ Mostrar Lista'; 
                }
                setTimeout(() => map.invalidateSize(), 300);
            });
        }, 350);
    </script>
</body>
</html>
